
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title></title>
    <link href="~/Styles/css/EstilosCorreos.css" rel="stylesheet">
</head>
<body>

    <table role="presentation" border="0" cellpadding="0" cellspacing="0">
        <tr>
            <td style="background-color: #4CAF50; color: #ffffff;">
                <h1>¡Bienvenido!</h1>
            </td>
        </tr>
        <tr>
            <td>
                <p>Hola: @@Nombre_Usuario </p>
                <p>Hemos recibido una solicitud para recuperar el acceso a tu cuenta. </p>
                <p>Por lo cual hemos generado la siguiente contraseña temporal: <b>@@ContraTemp</b> que expira: @@Vencimiento</p>
            </td>
        </tr>
        <tr>
            <td>
                <p>¡Gracias!</p>
            </td>
        </tr>
        <tr>
            <td style="background-color: #f4f4f4; color: #666666; font-size: 12px;">
                <p>Este es un correo generado automáticamente, por favor no respondas.</p>
            </td>
        </tr>
    </table>
</body>
</html>
