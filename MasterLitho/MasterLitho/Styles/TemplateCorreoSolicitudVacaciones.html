<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Solicitud de Vacaciones Aceptada</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        table {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-collapse: collapse;
        }

        td {
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #333333;
        }

        p {
            font-size: 16px;
            color: #666666;
        }

        a {
            color: #ffffff;
            background-color: #4CAF50;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <table role="presentation" border="0" cellpadding="0" cellspacing="0">
        <tr>
            <td style="background-color: #4CAF50; color: #ffffff;">
                <h1>¡Tu solicitud de vacaciones ha sido aceptada!</h1>
            </td>
        </tr>
        <tr>
            <td>
                <p>Hola: @@Nombre_Usuario</p>
                <p>Tu solicitud de vacaciones ha sido aceptada. Las fechas solicitadas son:</p>
                <p><b>Inicio: @@FechaInicio</b></p>
                <p><b>Fin: @@FechaFin</b></p>
            </td>
        </tr>
        <tr>
            <td>
                <p>¡Gracias por usar nuestro sistema!</p>
            </td>
        </tr>
        <tr>
            <td style="background-color: #f4f4f4; color: #666666; font-size: 12px;">
                <p>&copy; 2025 MastherLitho. Todos los derechos reservados.</p>
            </td>
        </tr>
    </table>
</body>
</html>
