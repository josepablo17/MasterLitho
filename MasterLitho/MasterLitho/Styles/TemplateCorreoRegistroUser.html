<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Registro de usuario</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f4f4;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f4f4f4; padding: 20px;">
        <tr>
            <td align="center">
                <table role="presentation" width="600px" cellspacing="0" cellpadding="0" border="0" style="background-color: #ffffff; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden;">
                    <!-- Encabezado -->
                    <tr>
                        <td style="background-color: #2017fc; padding: 20px; text-align: center; color: #ffffff; font-size: 24px;">
                            <strong>Credenciales de usuario</strong>
                        </td>
                    </tr>
                    <!-- Cuerpo del mensaje -->
                    <tr>
                        <td style="padding: 20px; text-align: center; color: #000;">
                            <p style="font-size: 18px;">Hola,<strong>@@Nombre</strong></p>
                            <p style="font-size: 16px; color: #555;">Hemos creado unas credenciales temporales, cambialas tan pronto ingreses sistema:</p>
                            <p style="font-size: 16px; margin: 10px 0;"><strong>Correo:</strong> @@Correo</p>
                            <p style="font-size: 16px; margin: 10px 0;"><strong>Contraseña:</strong> @@Contraseña</p>
                        </td>
                    </tr>
                    <!-- Pie de página -->
                    <tr>
                        <td style="background-color: #f4f4f4; color: #666666; font-size: 12px; text-align: center; padding: 15px;">
                            <p>&copy; 2025 MastherLitho. Todos los derechos reservados.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
